<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>writer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 173.2 200'><polygon points='86.6,0 173.2,50 173.2,150 86.6,200 0,150 0,50' fill='%23333'/><polygon points='86.6,16.3 158.5,58.15 158.5,141.85 86.6,183.7 14.1,141.85 14.1,58.15' fill='%23fff'/><g fill='%23333'><polygon points='41.1,58.5 47.6,58.5 44.6,86.5 38.1,86.5'/><polygon points='52.6,58.5 59.1,58.5 56.1,86.5 49.6,86.5'/><rect x='34.6' y='63.5' width='28' height='6.5'/><rect x='34.6' y='75' width='28' height='6.5'/><rect x='68.6' y='66' width='42' height='13' rx='6.5'/><rect x='68.6' y='98.5' width='62' height='9' rx='4.5'/><rect x='68.6' y='115.5' width='62' height='9' rx='4.5'/><rect x='68.6' y='132.5' width='37.2' height='9' rx='4.5'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
  // Set theme before first paint to avoid a flash.
  (function () {
    var stored = localStorage.getItem('writer-theme');
    document.documentElement.dataset.theme =
      stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.font = localStorage.getItem('writer-font') || 'serif';
    document.documentElement.style.setProperty('--scale', localStorage.getItem('writer-scale') || '1');
    // Inside the Windows app the page runs in WebView2, and the host injects window.mdHost first.
    if (window.chrome && window.chrome.webview) {
      var host = window.mdHost || {};
      document.documentElement.classList.add('host');
      document.documentElement.dataset.backdrop = host.backdrop || 'none';
      document.documentElement.style.setProperty('--caption-inset', (host.captionInset || 0) + 'px');
    }
  })();
</script>
<style>
  :root {
    --bg: #faf9f7;
    --fg: #1c1b19;
    --muted: #6e6a63;
    --faint: #b8b2a7;
    --accent: #3a6fc0;
    --hover: rgba(0, 0, 0, .05);
    --codebg: rgba(0, 0, 0, .045);
    --sel: rgba(58, 111, 192, .18);
    --mono: ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace;
    --scale: 1;
  }
  :root[data-theme="dark"] {
    --bg: #17181a;
    --fg: #dcd9d3;
    --muted: #8f8c85;
    --faint: #4e4c47;
    --accent: #7ea6f0;
    --hover: rgba(255, 255, 255, .06);
    --codebg: rgba(255, 255, 255, .055);
    --sel: rgba(126, 166, 240, .25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.7 'Libertinus Serif', Charter, 'Iowan Old Style', Georgia, Cambria, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--sel); }

  header {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .45rem .8rem;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(8px);
    font-family: system-ui, sans-serif;
  }
  #filename {
    font-size: .8rem;
    color: var(--muted);
    letter-spacing: .02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #filename.dirty::after {
    content: ' \25CF';
    color: var(--accent);
    font-size: .6em;
    vertical-align: .25em;
  }
  .actions { display: flex; gap: .2rem; }
  .actions button {
    background: none;
    border: 0;
    padding: 0;
    color: var(--muted);
    width: 2rem;
    height: 2rem;
    display: grid;
    place-items: center;
    border-radius: .5rem;
    cursor: pointer;
  }
  .actions button:hover { background: var(--hover); color: var(--fg); }
  .actions svg {
    width: 1.05rem;
    height: 1.05rem;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  :root[data-theme="light"] .icon-sun { display: none; }
  :root[data-theme="dark"] .icon-moon { display: none; }
  .actions .glyph { font-size: .95rem; line-height: 1; }
  .glyph.icon-serif { font-family: 'Libertinus Serif', Georgia, serif; }
  .glyph.icon-mono { font-family: var(--mono); font-size: .85rem; }
  :root[data-font="serif"] .icon-serif { display: none; }
  :root[data-font="mono"] .icon-mono { display: none; }
  :root[data-font="mono"] .editor { font-family: var(--mono); font-size: calc(15px * var(--scale)); }

  /* size slider popover, shown briefly after the font button is used */
  #sizer {
    position: absolute;
    right: .8rem;
    top: calc(100% + .15rem);
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .45rem .7rem;
    border-radius: .6rem;
    background: color-mix(in srgb, var(--bg) 94%, var(--fg));
    box-shadow: 0 2px 12px rgba(0, 0, 0, .14);
    font-size: 12px;
    color: var(--muted);
    opacity: 0;
    visibility: hidden;
    transition: opacity .5s ease, visibility 0s linear .5s;
  }
  #sizer.show {
    opacity: 1;
    visibility: visible;
    transition: opacity .15s ease;
  }
  #sizer input {
    -webkit-appearance: none;
    appearance: none;
    width: 8.5rem;
    height: 1rem;
    margin: 0;
    background: none;
    cursor: pointer;
  }
  #sizer input::-webkit-slider-runnable-track { height: 2px; background: var(--faint); border-radius: 1px; }
  #sizer input::-moz-range-track { height: 2px; background: var(--faint); border-radius: 1px; }
  #sizer input::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: .8rem;
    height: .8rem;
    margin-top: calc(-.4rem + 1px);
    border-radius: 50%;
    background: var(--fg);
    border: 0;
  }
  #sizer input::-moz-range-thumb {
    width: .8rem;
    height: .8rem;
    border-radius: 50%;
    background: var(--fg);
    border: 0;
  }
  #sizer input:focus-visible { outline: 1px solid var(--muted); outline-offset: 2px; }
  #sizer output { min-width: 2.8em; text-align: right; font-variant-numeric: tabular-nums; }

  .editor {
    font-size: calc(17px * var(--scale));
    max-width: 43rem;
    margin: 0 auto;
    padding: 3rem 1.4rem 35vh;
    outline: none;
    caret-color: var(--accent);
    white-space: pre-wrap;
    overflow-wrap: break-word;
    position: relative;
  }
  .editor[data-empty="true"]::before {
    content: 'Write\2026';
    position: absolute;
    top: 3rem;
    left: 1.4rem;
    color: var(--faint);
    pointer-events: none;
  }

  .mark { color: var(--faint); }
  /* heading marks hang in the left margin so heading text aligns with body */
  .hang {
    position: absolute;
    transform: translateX(-100%);
  }
  @media (max-width: 640px) {
    .hang { position: static; transform: none; }
  }

  .h1 { font-size: 1.85em; font-weight: 700; line-height: 1.25; margin-top: .6em; }
  .h2 { font-size: 1.45em; font-weight: 700; line-height: 1.3;  margin-top: .6em; }
  .h3 { font-size: 1.2em;  font-weight: 700; margin-top: .5em; }
  .h4 { font-size: 1.05em; font-weight: 700; margin-top: .4em; }
  .h5 { font-size: 1em;    font-weight: 700; }
  .h6 { font-size: .95em;  font-weight: 600; color: var(--muted); }
  .line:first-child { margin-top: 0; }

  .quote {
    border-left: 3px solid var(--faint);
    padding-left: .9rem;
    color: var(--muted);
    font-style: italic;
  }
  .hr { color: var(--faint); }
  .done { color: var(--muted); }

  .fence, .codeblock {
    font-family: var(--mono);
    font-size: .85em;
    line-height: 1.75;
    background: var(--codebg);
    padding: 0 .9rem;
  }
  .line code {
    font-family: var(--mono);
    font-size: .85em;
    background: var(--codebg);
    padding: .08em .3em;
    border-radius: .3em;
  }
  .link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .url { color: var(--faint); }
  del { color: var(--muted); }

  #status {
    position: fixed;
    right: 1rem;
    bottom: .8rem;
    display: flex;
    align-items: baseline;
    gap: .55rem;
    font: 12px system-ui, sans-serif;
    color: var(--faint);
    user-select: none;
    pointer-events: none;
  }
  #selcount {
    color: var(--muted);
    background: var(--codebg);
    border-radius: .6em;
    padding: .15em .5em;
  }

  @media print {
    header, #status, #notice { display: none; }
    .editor { padding: 0; max-width: none; }
  }

  /* ---------- Windows app only: the header doubles as the title bar ---------- */
  /* Below 100% lets the window's Mica backdrop tint the page, but the header then reads as a separate band. */
  :root.host { --veil: 100%; }
  /* The app sets type in Georgia, which every Windows install has, so it needs no web font. */
  :root.host body, :root.host .glyph.icon-serif { font-family: Georgia, serif; }
  :root.host body { background: color-mix(in srgb, var(--bg) var(--veil), transparent); }
  :root.host header {
    height: 48px;
    padding: 0 calc(var(--caption-inset) + .4rem) 0 1rem;
  }
  :root.host #sizer { right: calc(var(--caption-inset) + .8rem); }
  .actions button[hidden] { display: none; }
  #btn-md.on { color: var(--accent); }
  .ctrl .link, .ctrl .url { cursor: pointer; }

  #notice {
    position: fixed;
    top: calc(48px + .6rem);
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: .3rem;
    max-width: calc(100vw - 2rem);
    padding: .4rem .5rem .4rem .9rem;
    border-radius: .6rem;
    background: color-mix(in srgb, var(--bg) 94%, var(--fg));
    box-shadow: 0 2px 12px rgba(0, 0, 0, .14);
    font: 13px system-ui, sans-serif;
    color: var(--muted);
  }
  #notice[hidden] { display: none; }
  #notice-text { margin-right: .5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #notice button {
    background: none;
    border: 0;
    padding: .25rem .5rem;
    border-radius: .4rem;
    font: inherit;
    color: var(--accent);
    white-space: nowrap;
    cursor: pointer;
  }
  #notice button:hover { background: var(--hover); }
</style>

<body>

<header>
  <span id="filename">untitled.md</span>
  <div class="actions">
    <button id="btn-md" title="Markdown styling" hidden>
      <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 15V9l2.5 3 2.5-3v6M17 9v6m-2.2-2.2L17 15l2.2-2.2"/></svg>
    </button>
    <button id="btn-open" title="Open (Ctrl+O)">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
    <button id="btn-save" title="Save (Ctrl+S) &#8212; Save as (Ctrl+Shift+S)">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </button>
    <button id="btn-font" title="Toggle font">
      <span class="glyph icon-serif">Aa</span>
      <span class="glyph icon-mono">Aa</span>
    </button>
    <button id="btn-theme" title="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
    </button>
  </div>
  <div id="sizer" aria-label="Text size">
    <input id="size-range" type="range" min="0.7" max="1.6" step="0.05" value="1">
    <output id="size-out" for="size-range">100%</output>
  </div>
</header>

<div id="notice" role="status" hidden><span id="notice-text"></span><button id="notice-yes"></button><button id="notice-no"></button></div>
<main id="editor" class="editor" contenteditable="true" spellcheck="true"></main>
<div id="status"><span id="selcount" hidden></span><span id="wordcount"></span></div>
<input id="file-input" type="file" accept=".md,.markdown,.txt" hidden>

<script id="app">
'use strict';

const editor = document.getElementById('editor');
const fileNameEl = document.getElementById('filename');
const wordCountEl = document.getElementById('wordcount');
const selCountEl = document.getElementById('selcount');
const fileInput = document.getElementById('file-input');

let fileHandle = null;
let fileName = 'untitled.md';
let savedText = '';
let undoStack = [];
let redoStack = [];
let current = { text: '', caret: 0 };
let lastPushTime = -Infinity;
let composing = false;

// In the Windows app, WebView2 gives the page a message channel to the native host.
const host = window.chrome && window.chrome.webview ? window.chrome.webview : null;
let styled = true;          // markdown styling; plain text files open without it in the app
let pendingSave = null;     // text handed to the host to save, until it confirms
let postedDirty = false;

const MD_TYPES = [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown'] } }];

/* ---------- markdown rendering (styling only; the text IS the markdown) ---------- */

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function mark(s) {
  return '<span class="mark">' + escapeHtml(s) + '</span>';
}

function inline(text) {
  if (!text) return '';
  const stash = [];
  const put = html => '\x00' + (stash.push(html) - 1) + '\x00';
  let s = escapeHtml(text.replace(/\x00/g, ''));
  s = s.replace(/(`+)([^`]+)\1/g, (_, t, c) => put(mark(t) + '<code>' + c + '</code>' + mark(t)));
  s = s.replace(/\*\*([^*]+)\*\*/g, (_, t) => put(mark('**') + '<strong>' + t + '</strong>' + mark('**')));
  s = s.replace(/__([^_]+)__/g, (_, t) => put(mark('__') + '<strong>' + t + '</strong>' + mark('__')));
  s = s.replace(/~~([^~]+)~~/g, (_, t) => put(mark('~~') + '<del>' + t + '</del>' + mark('~~')));
  s = s.replace(/\*([^*\s](?:[^*]*[^*\s])?)\*/g, (_, t) => put(mark('*') + '<em>' + t + '</em>' + mark('*')));
  s = s.replace(/!\[([^\]]*)\]\(([^)]*)\)/g, (_, t, u) =>
    put(mark('![') + '<span class="link">' + t + '</span>' + mark('](') + '<span class="url">' + u + '</span>' + mark(')')));
  s = s.replace(/\[([^\]]+)\]\(([^)]*)\)/g, (_, t, u) =>
    put(mark('[') + '<span class="link">' + t + '</span>' + mark('](') + '<span class="url">' + u + '</span>' + mark(')')));
  s = s.replace(/(^|[\s(])_([^_\s](?:[^_]*[^_\s])?)_(?=$|[\s.,;:!?)])/g, (_, pre, t) =>
    pre + put(mark('_') + '<em>' + t + '</em>' + mark('_')));
  while (/\x00\d+\x00/.test(s)) s = s.replace(/\x00(\d+)\x00/g, (_, i) => stash[+i]);
  return s;
}

function renderLine(raw) {
  let m;
  if ((m = raw.match(/^(#{1,6}) (.*)$/)))
    return {
      cls: 'line h' + m[1].length,
      html: '<span class="mark hang">' + escapeHtml(m[1] + ' ') + '</span>' + (m[2] ? inline(m[2]) : '<br>')
    };
  if (/^ {0,3}([-*_]) *(?:\1 *){2,}$/.test(raw))
    return { cls: 'line hr', html: mark(raw) };
  if ((m = raw.match(/^( {0,3})(> ?)(.*)$/)))
    return { cls: 'line quote', html: escapeHtml(m[1]) + mark(m[2]) + inline(m[3]) };
  if ((m = raw.match(/^(\s*)([-*+] )(\[[ xX]\] )?(.*)$/)))
    return {
      cls: 'line li' + (m[3] ? (/x/i.test(m[3]) ? ' done' : '') : ''),
      html: escapeHtml(m[1]) + mark(m[2]) + (m[3] ? mark(m[3]) : '') + inline(m[4])
    };
  if ((m = raw.match(/^(\s*)(\d{1,9}[.)] )(.*)$/)))
    return { cls: 'line li', html: escapeHtml(m[1]) + mark(m[2]) + inline(m[3]) };
  return { cls: 'line p', html: inline(raw) };
}

function render() {
  const caret = caretOffset();
  let fence = false;
  let changed = false;
  for (const line of editor.children) {
    const raw = line.textContent.replace(/ /g, ' ');
    let cls, html;
    if (!styled) {
      cls = 'line';
      html = escapeHtml(raw);
    } else if (/^ {0,3}(`{3,}|~{3,})/.test(raw)) {
      cls = 'line fence';
      html = mark(raw);
      fence = !fence;
    } else if (fence) {
      cls = 'line codeblock';
      html = escapeHtml(raw);
    } else {
      ({ cls, html } = renderLine(raw));
    }
    if (html === '') html = '<br>';
    if (line.className !== cls) line.className = cls;
    if (line.innerHTML !== html) { line.innerHTML = html; changed = true; }
  }
  editor.dataset.empty =
    editor.children.length === 1 && editor.children[0].textContent === '' ? 'true' : 'false';
  if (changed && caret !== null) setCaretOffset(caret);
}

/* ---------- text model: one div per line, textContent is the source of truth ---------- */

function getText() {
  return Array.from(editor.children, l => l.textContent.replace(/ /g, ' ')).join('\n');
}

function buildLines(text) {
  editor.textContent = '';
  const frag = document.createDocumentFragment();
  for (const lineText of text.split('\n')) {
    const div = document.createElement('div');
    div.className = 'line';
    if (lineText === '') div.innerHTML = '<br>';
    else div.textContent = lineText;
    frag.appendChild(div);
  }
  editor.appendChild(frag);
}

function setText(text) {
  buildLines(text);
  render();
}

// Repair the DOM if editing left stray non-div nodes at the top level
// (e.g. after select-all + delete, or typing into a fully emptied editor).
function normalizeStructure() {
  const ok = editor.childNodes.length > 0 &&
    Array.from(editor.childNodes).every(n => n.nodeType === 1 && n.tagName === 'DIV');
  if (ok) return;
  let caret = null;
  const sel = getSelection();
  if (sel.rangeCount && editor.contains(sel.getRangeAt(0).startContainer)) {
    const r = document.createRange();
    r.selectNodeContents(editor);
    r.setEnd(sel.getRangeAt(0).startContainer, sel.getRangeAt(0).startOffset);
    caret = r.toString().length;
  }
  const text = (editor.innerText || '').replace(/ /g, ' ').replace(/\n+$/, '');
  buildLines(text);
  if (caret !== null) setCaretOffset(Math.min(caret, text.length));
}

/* ---------- caret handling by absolute character offset ---------- */

function offsetAt(container, offset) {
  if (container === editor) {
    let off = 0;
    const idx = Math.min(offset, editor.children.length);
    for (let i = 0; i < idx; i++) off += editor.children[i].textContent.length + 1;
    return Math.min(off, getText().length);
  }
  let node = container;
  while (node.parentNode && node.parentNode !== editor) node = node.parentNode;
  if (node.parentNode !== editor) return 0;
  let off = 0;
  for (const l of editor.children) {
    if (l === node) break;
    off += l.textContent.length + 1;
  }
  const r = document.createRange();
  r.selectNodeContents(node);
  try { r.setEnd(container, offset); } catch (e) { return off; }
  return off + r.toString().length;
}

function selectionOffsets() {
  const sel = getSelection();
  if (!sel || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if (!editor.contains(r.startContainer) || !editor.contains(r.endContainer)) return null;
  const a = offsetAt(r.startContainer, r.startOffset);
  const b = offsetAt(r.endContainer, r.endOffset);
  return a <= b ? [a, b] : [b, a];
}

function caretOffset() {
  const offs = selectionOffsets();
  return offs ? offs[0] : null;
}

function placeCaret(node, offset) {
  const sel = getSelection();
  const r = document.createRange();
  r.setStart(node, offset);
  r.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r);
}

function setCaretOffset(off) {
  let remaining = off;
  for (const line of editor.children) {
    const len = line.textContent.length;
    if (remaining <= len) {
      const walker = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        if (remaining <= node.textContent.length) return placeCaret(node, remaining);
        remaining -= node.textContent.length;
      }
      return placeCaret(line, 0);
    }
    remaining -= len + 1;
  }
  const lastLine = editor.lastElementChild;
  if (!lastLine) return;
  const walker = document.createTreeWalker(lastLine, NodeFilter.SHOW_TEXT);
  let node, lastText = null;
  while ((node = walker.nextNode())) lastText = node;
  if (lastText) placeCaret(lastText, lastText.textContent.length);
  else placeCaret(lastLine, 0);
}

/* ---------- edits that go through the text model ---------- */

function applyText(text, caret, forceUndoBoundary) {
  buildLines(text);
  render();
  setCaretOffset(caret);
  const sel = getSelection();
  const n = sel.anchorNode;
  const el = n && (n.nodeType === 1 ? n : n.parentElement);
  if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  handleChange(forceUndoBoundary);
}

function insertTextAtSelection(text, forceUndoBoundary) {
  const offs = selectionOffsets();
  if (!offs) return;
  const [a, b] = offs;
  const full = getText();
  applyText(full.slice(0, a) + text + full.slice(b), a + text.length, forceUndoBoundary);
}

function wrapSelection(marker) {
  const offs = selectionOffsets();
  if (!offs) return;
  const [a, b] = offs;
  const full = getText();
  const next = full.slice(0, a) + marker + full.slice(a, b) + marker + full.slice(b);
  const caret = a === b ? a + marker.length : b + 2 * marker.length;
  applyText(next, caret, true);
}

/* ---------- undo / redo (custom; DOM rewrites break native history) ---------- */

function recordChange(force) {
  const text = getText();
  if (text === current.text) return;
  const now = performance.now();
  if (force || now - lastPushTime > 700) {
    undoStack.push({ text: current.text, caret: current.caret });
    if (undoStack.length > 500) undoStack.shift();
  }
  lastPushTime = now;
  redoStack.length = 0;
  current = { text: text, caret: caretOffset() ?? text.length };
}

function applyState(s) {
  buildLines(s.text);
  render();
  setCaretOffset(Math.min(s.caret, s.text.length));
  current = { text: s.text, caret: s.caret };
  lastPushTime = -Infinity;
  updateStatus();
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push({ text: getText(), caret: caretOffset() ?? 0 });
  applyState(undoStack.pop());
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push({ text: getText(), caret: caretOffset() ?? 0 });
  applyState(redoStack.pop());
}

function handleChange(force) {
  recordChange(force);
  updateStatus();
}

/* ---------- status ---------- */

function updateStatus() {
  const text = getText();
  const dirty = text !== savedText;
  fileNameEl.textContent = fileName;
  fileNameEl.classList.toggle('dirty', dirty);
  document.title = (dirty ? '● ' : '') + fileName;
  if (host && dirty !== postedDirty) {
    postedDirty = dirty;
    host.postMessage({ type: 'dirty', dirty: dirty });
  }
  const words = countWords(text);
  wordCountEl.textContent = words + (words === 1 ? ' word' : ' words');
  updateSelectionCount();
}

function countWords(text) {
  return (text.match(/\S+/g) || []).length;
}

function updateSelectionCount() {
  const offs = selectionOffsets();
  const words = offs && offs[0] < offs[1] ? countWords(getText().slice(offs[0], offs[1])) : 0;
  selCountEl.hidden = words === 0;
  if (words) selCountEl.textContent = words + (words === 1 ? ' word' : ' words') + ' selected';
}

/* ---------- file open / save ---------- */

function loadDocument(text, name, handle, force) {
  if (!force && getText() !== savedText && !confirm('Discard unsaved changes?')) return;
  fileHandle = handle || null;
  fileName = name || 'untitled.md';
  setText(text.replace(/\r\n?/g, '\n'));
  savedText = getText();
  undoStack = [];
  redoStack = [];
  current = { text: savedText, caret: 0 };
  lastPushTime = -Infinity;
  updateStatus();
  editor.focus();
  setCaretOffset(0);
  window.scrollTo(0, 0);
}

async function openFile() {
  if (host) return host.postMessage({ type: 'open' });
  try {
    if ('showOpenFilePicker' in window) {
      const [handle] = await showOpenFilePicker({ types: MD_TYPES });
      const file = await handle.getFile();
      loadDocument(await file.text(), file.name, handle);
    } else {
      fileInput.click();
    }
  } catch (err) {
    if (err.name !== 'AbortError') alert('Could not open file: ' + err.message);
  }
}

async function saveFile(saveAs) {
  const text = getText();
  if (host) {
    pendingSave = text;
    return host.postMessage({ type: 'save', text: text, saveAs: !!saveAs });
  }
  try {
    if ('showSaveFilePicker' in window) {
      if (!fileHandle || saveAs) {
        fileHandle = await showSaveFilePicker({ suggestedName: fileName, types: MD_TYPES });
        fileName = fileHandle.name;
      }
      const writable = await fileHandle.createWritable();
      await writable.write(text);
      await writable.close();
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown' }));
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(a.href);
    }
    savedText = text;
    updateStatus();
  } catch (err) {
    if (err.name !== 'AbortError') alert('Could not save file: ' + err.message);
  }
}

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (file) loadDocument(await file.text(), file.name, null);
  fileInput.value = '';
});

/* ---------- theme ---------- */

function toggleFont() {
  const next = document.documentElement.dataset.font === 'mono' ? 'serif' : 'mono';
  document.documentElement.dataset.font = next;
  localStorage.setItem('writer-font', next);
  showSizer();
}

/* ---------- text size ---------- */

const sizer = document.getElementById('sizer');
const sizeRange = document.getElementById('size-range');
const sizeOut = document.getElementById('size-out');
let sizerTimer = 0;

function setScale(value) {
  const v = Math.min(1.6, Math.max(0.7, parseFloat(value) || 1));
  document.documentElement.style.setProperty('--scale', v);
  sizeRange.value = v;
  sizeOut.textContent = Math.round(v * 100) + '%';
  localStorage.setItem('writer-scale', v);
}

function showSizer() {
  sizer.classList.add('show');
  clearTimeout(sizerTimer);
  sizerTimer = setTimeout(hideSizer, 3000);
}

function hideSizer() {
  clearTimeout(sizerTimer);
  sizer.classList.remove('show');
}

setScale(localStorage.getItem('writer-scale') || 1);
sizeRange.addEventListener('input', () => { setScale(sizeRange.value); showSizer(); });
sizeRange.addEventListener('keydown', showSizer);
sizer.addEventListener('pointerenter', () => { clearTimeout(sizerTimer); sizer.classList.add('show'); });
sizer.addEventListener('pointerleave', showSizer);
editor.addEventListener('input', hideSizer);

function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('writer-theme', next);
  postTheme();
}

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  if (!localStorage.getItem('writer-theme'))
    document.documentElement.dataset.theme = e.matches ? 'dark' : 'light';
  postTheme();
});

function postTheme() {
  if (host) host.postMessage({ type: 'theme', dark: document.documentElement.dataset.theme === 'dark' });
}

/* ---------- events ---------- */

editor.addEventListener('input', () => {
  if (composing) return;
  normalizeStructure();
  render();
  handleChange(false);
});

editor.addEventListener('compositionstart', () => { composing = true; });
editor.addEventListener('compositionend', () => {
  composing = false;
  normalizeStructure();
  render();
  handleChange(true);
});

editor.addEventListener('beforeinput', e => {
  if (e.inputType === 'historyUndo') { e.preventDefault(); undo(); }
  else if (e.inputType === 'historyRedo') { e.preventDefault(); redo(); }
});

editor.addEventListener('keydown', e => {
  if (composing) return;
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Enter') {
    e.preventDefault();
    insertTextAtSelection('\n', true);
  } else if (e.key === 'Tab') {
    e.preventDefault();
    insertTextAtSelection('  ', false);
  } else if (mod && !e.shiftKey && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    undo();
  } else if (mod && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) {
    e.preventDefault();
    redo();
  } else if (mod && e.key.toLowerCase() === 'b') {
    e.preventDefault();
    wrapSelection('**');
  } else if (mod && e.key.toLowerCase() === 'i') {
    e.preventDefault();
    wrapSelection('*');
  }
});

editor.addEventListener('paste', e => {
  e.preventDefault();
  const text = e.clipboardData.getData('text/plain').replace(/\r\n?/g, '\n');
  insertTextAtSelection(text, true);
});

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'o') {
    e.preventDefault();
    openFile();
  } else if (mod && e.key.toLowerCase() === 's') {
    e.preventDefault();
    saveFile(e.shiftKey);
  }
});

window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  if (host) {
    // The host needs real paths (to save in place and watch), which only it can resolve.
    if (e.dataTransfer.files.length) host.postMessageWithAdditionalObjects({ type: 'drop' }, e.dataTransfer.files);
    return;
  }
  const item = e.dataTransfer.items && e.dataTransfer.items[0];
  if (!item || item.kind !== 'file') return;
  const file = item.getAsFile();
  const handlePromise = item.getAsFileSystemHandle ? item.getAsFileSystemHandle() : Promise.resolve(null);
  Promise.all([file.text(), handlePromise.catch(() => null)]).then(([text, handle]) => {
    if (handle && handle.kind !== 'file') handle = null;
    loadDocument(text, file.name, handle);
  });
});

window.addEventListener('beforeunload', e => {
  if (!host && getText() !== savedText) {
    e.preventDefault();
    e.returnValue = '';
  }
});

document.getElementById('btn-open').addEventListener('click', openFile);
document.getElementById('btn-save').addEventListener('click', () => saveFile(false));
document.getElementById('btn-font').addEventListener('click', toggleFont);
document.getElementById('btn-theme').addEventListener('click', toggleTheme);

document.addEventListener('selectionchange', updateSelectionCount);

/* ---------- Windows app host bridge (never runs on the web) ---------- */

function startHostBridge() {
  // No spellcheck in the app: its squiggles fight the markdown, and code words are rarely in a dictionary.
  editor.spellcheck = false;
  const root = document.documentElement;
  const header = document.querySelector('header');
  const actions = document.querySelector('.actions');
  const mdButton = document.getElementById('btn-md');
  const notice = document.getElementById('notice');
  const noticeText = document.getElementById('notice-text');
  const noticeYes = document.getElementById('notice-yes');
  const noticeNo = document.getElementById('notice-no');

  function showNotice(text, yes, onYes, no, onNo) {
    noticeText.textContent = text;
    noticeYes.textContent = yes;
    noticeNo.textContent = no;
    noticeYes.onclick = () => { hideNotice(); onYes(); };
    noticeNo.onclick = () => { hideNotice(); if (onNo) onNo(); };
    notice.hidden = false;
  }

  function hideNotice() {
    if (notice.hidden) return;
    notice.hidden = true;
    editor.focus({ preventScroll: true });
  }

  // Swap in new text from disk as one undoable step, keeping the reading position
  // (or following the end, for files that grow like logs).
  function reloadText(text) {
    const scroller = document.documentElement;
    const atEnd = window.innerHeight + window.scrollY >= scroller.scrollHeight - 4;
    const y = window.scrollY;
    const caret = caretOffset();
    buildLines(text);
    render();
    if (caret !== null) setCaretOffset(Math.min(caret, text.length));
    savedText = getText();
    recordChange(true);
    updateStatus();
    window.scrollTo(0, atEnd ? scroller.scrollHeight : y);
  }

  function diskChanged(text) {
    text = text.replace(/\r\n?/g, '\n');
    hideNotice();
    if (getText() === text) {
      savedText = text;
      updateStatus();
    } else if (getText() === savedText) {
      reloadText(text);
    } else {
      showNotice(fileName + ' changed on disk.', 'Reload', () => reloadText(text),
        'Keep mine', () => { savedText = text; updateStatus(); });
    }
  }

  function postTitleBar() {
    const r = actions.getBoundingClientRect();
    host.postMessage({ type: 'titlebar', height: header.offsetHeight, x: r.left, y: r.top, w: r.width, h: r.height });
  }

  function nudgeScale(delta) {
    setScale(Math.round((parseFloat(sizeRange.value) + delta) * 20) / 20);
    showSizer();
  }

  host.addEventListener('message', e => {
    const m = e.data;
    if (m.type === 'load') {
      styled = m.styled;
      mdButton.hidden = !m.toggle;
      mdButton.classList.toggle('on', styled);
      if (m.mono) root.dataset.font = 'mono';
      hideNotice();
      loadDocument(m.text, m.name, null, true);
    } else if (m.type === 'changed') {
      diskChanged(m.text);
    } else if (m.type === 'deleted') {
      savedText = null;
      updateStatus();
      showNotice(fileName + ' was moved or deleted.', 'Save it here', () => saveFile(false), 'Dismiss');
    } else if (m.type === 'saved') {
      if (pendingSave !== null) savedText = pendingSave;
      pendingSave = null;
      fileName = m.name;
      hideNotice();
      updateStatus();
    } else if (m.type === 'save-failed') {
      pendingSave = null;
    } else if (m.type === 'chrome') {
      root.style.setProperty('--caption-inset', m.captionInset + 'px');
      root.classList.toggle('fullscreen', m.fullscreen);
      postTitleBar();
    }
  });

  mdButton.addEventListener('click', () => {
    styled = !styled;
    mdButton.classList.toggle('on', styled);
    render();
    host.postMessage({ type: 'styled', on: styled });
  });

  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    let msg = null;
    if (e.key === 'F11' || (e.key === 'Escape' && root.classList.contains('fullscreen'))) msg = { type: 'fullscreen' };
    else if (mod && !e.shiftKey && k === 'n') msg = { type: 'new' };
    else if (mod && k === 'w') msg = { type: 'close' };
    else if (mod && k === 'f') msg = { type: 'find' };
    else if (mod && k === 'p') msg = { type: 'print' };
    else if (mod && (k === '=' || k === '+')) { e.preventDefault(); nudgeScale(.05); }
    else if (mod && k === '-') { e.preventDefault(); nudgeScale(-.05); }
    else if (mod && k === '0') { e.preventDefault(); setScale(1); showSizer(); }
    if (msg) {
      e.preventDefault();
      host.postMessage(msg);
    }
  });

  // Browser zoom is off in the app; Ctrl+wheel drives the text size instead.
  window.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    nudgeScale(e.deltaY < 0 ? .05 : -.05);
  }, { passive: false });

  // Ctrl+click follows a markdown link: web links open in the browser, relative ones in a new window.
  const trackCtrl = e => root.classList.toggle('ctrl', e.ctrlKey);
  document.addEventListener('keydown', trackCtrl);
  document.addEventListener('keyup', trackCtrl);
  window.addEventListener('blur', () => root.classList.remove('ctrl'));
  editor.addEventListener('click', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    let el = e.target.closest && e.target.closest('.link, .url');
    while (el && !el.classList.contains('url')) el = el.nextElementSibling;
    const href = el && el.textContent.trim().split(/\s+/)[0].replace(/^<|>$/g, '');
    if (!href) return;
    e.preventDefault();
    host.postMessage({ type: 'link', href: href });
  });

  new ResizeObserver(postTitleBar).observe(actions);
  window.addEventListener('resize', postTitleBar);
  postTitleBar();
  postTheme();
  host.postMessage({ type: 'ready' });
}

/* ---------- init ---------- */

setText('');
updateStatus();
editor.focus();
if (host) startHostBridge();
</script>
</body>
</html>
